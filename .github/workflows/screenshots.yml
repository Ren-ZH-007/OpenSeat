name: UI screenshots
on:
  push:
    branches: [ci/screenshots]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          cmd /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Screen resolution
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Output "resolution unchanged: $_" }
      - name: Run app and capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try {
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient, UIAutomationTypes
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
          }
          function Find($root, $name) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            for ($i=0; $i -lt 20; $i++) { $e = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c); if ($e) { return $e }; Start-Sleep -Milliseconds 500 }
            return $null
          }
          function Click($e) { if ($e) { $e.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() } }
          $p = Start-Process -FilePath dist\OpenSeat.exe -PassThru
          Start-Sleep -Seconds 5
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $main = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)))
          if ($main) { $main.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).SetWindowVisualState('Maximized') }
          Start-Sleep -Seconds 2
          Add-Type -Namespace W -Name M -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y); [DllImport("user32.dll")] public static extern void mouse_event(int f,int x,int y,int d,int e);'
          function Tap($x,$y) { [W.M]::SetCursorPos($x,$y); Start-Sleep -Milliseconds 150; [W.M]::mouse_event(2,0,0,0,0); [W.M]::mouse_event(4,0,0,0,0); Start-Sleep -Milliseconds 600 }
          Tap 177 450; [System.Windows.Forms.SendKeys]::SendWait('{DOWN}{ENTER}'); Start-Sleep -Seconds 2
          [W.M]::SetCursorPos(1900,1000); Start-Sleep -Seconds 2
          Shot '1-main'
          Tap 335 265; Start-Sleep -Seconds 3
          [W.M]::SetCursorPos(1900,1000); Shot '3-monitor-window'
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}'); Start-Sleep -Seconds 1
          Tap 536 144; Start-Sleep -Seconds 3
          [W.M]::SetCursorPos(1900,1000); Shot '2-vm-seats'
          $p | Stop-Process -Force
          } catch { Write-Output "::error::$($_.Exception.Message) at $($_.InvocationInfo.ScriptLineNumber)" }
          Get-ChildItem shots | ForEach-Object { Write-Output "::notice::shot $($_.Name) $($_.Length)" }
      - name: Publish screenshots to branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add shots/*.png
          git commit -m "ci: UI screenshots [skip ci]"
          git push origin HEAD:ci/screenshots

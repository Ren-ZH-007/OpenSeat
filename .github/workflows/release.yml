name: Build and release Windows preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
concurrency:
  group: openseat-preview-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.4.0-preview.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Windows x64 applications and tests
        shell: pwsh
        run: |
          cmd /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Application compilation failed' }
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /codepage:65001 /target:exe /platform:x64 /optimize+ /out:dist\OpenSeat.Tests.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll native\OpenSeat.cs native\VmSeats.cs native\SelfTest.cs
          if ($LASTEXITCODE -ne 0) { throw 'Regression test compilation failed' }
          & $compiler /nologo /codepage:65001 /target:exe /platform:x64 /optimize+ /out:dist\Gaming.Tests.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll native\Gaming.cs native\GamingTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Gaming test compilation failed' }
      - name: Run configuration and Windows runtime tests
        shell: pwsh
        env:
          OPENSEAT_CI: '1'
        run: |
          & .\dist\OpenSeat.Tests.exe --self-test 2>&1 | Tee-Object -FilePath native-test-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          & .\dist\Gaming.Tests.exe --self-test 2>&1 | Tee-Object -FilePath gaming-test-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Gaming tests failed' }
          if (-not (Select-String native-test-results.txt -Pattern '28 checks passed' -Quiet)) { throw 'Expected regression count missing' }
          if (-not (Select-String gaming-test-results.txt -Pattern '31 gaming checks passed' -Quiet)) { throw 'Expected interactive runtime test count missing' }
      - name: Package both applications and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\OpenSeat.exe,dist\OpenSeat.Gaming.exe package
          Copy-Item README.md,native-test-results.txt,gaming-test-results.txt package
          Copy-Item native\GAMING.md package\GAMING.md
          @{
            version = $env:RELEASE_TAG
            source_sha = $env:GITHUB_SHA
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            code_checks_passed = 59
            test_environment = 'Windows Server 2022 x64 GitHub runner'
            physical_multiseat_validated = $false
            game_compatibility_validated = $false
            desktop_input_isolation = 'External engine required; not implemented by OpenSeat'
          } | ConvertTo-Json | Set-Content package\BUILD-INFO.json -Encoding utf8
          @'
          OpenSeat 0.4.0-preview.1 / Windows x64
          将两个 EXE 解压到同一目录，再运行 OpenSeat.exe。
          点击“原生工位游戏…”打开游戏启动器；也可直接运行 OpenSeat.Gaming.exe。
          游戏启动器在当前 Windows 会话运行，不创建独立桌面或分配键鼠。
          三个独立工位需要另外安装、授权并配置外部多工位引擎。
          LOL、三角洲、CF 是可配置启动项，不表示已通过游戏兼容性认证。
          无 OpenSeat 登录、激活或角色权限系统；Windows 系统权限仍然适用。
          .NET Framework 4.x required. EXEs are unsigned.
          59 code checks passed. Physical hardware and real games NOT validated.
          '@ | Set-Content package\START-HERE.txt -Encoding utf8
          Compress-Archive -Path package\* -DestinationPath OpenSeat-0.4.0-preview.1-win-x64.zip
          $assets = @('dist\OpenSeat.exe','dist\OpenSeat.Gaming.exe','OpenSeat-0.4.0-preview.1-win-x64.zip')
          $lines = foreach ($asset in $assets) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish prerelease after successful build and tests
        shell: pwsh
        run: |
          @'
          ## OpenSeat 0.4.0 开发预览版
          
          下载 **OpenSeat-0.4.0-preview.1-win-x64.zip**，解压后将两个 EXE 保持在同一目录，运行 OpenSeat.exe。
          Windows 10 及以上 x64 为目标环境，需要 .NET Framework 4.x；本次编译及自动化测试环境为 Windows Server 2022。
          
          ### 本次新增
          - 原生会话游戏启动器：配置 LOL、三角洲、CF 的官方启动器路径与参数。
          - 当前 Windows 会话内启动、重复启动拦截、进程跟踪和手动窗口定位。
          - 会话诊断、按用户保存配置、日志轮转。
          - 打开游戏入口时暂停输入测试和屏幕监控。
          - 修复 C:game.exe、\game.exe 等不完整 Windows 路径被错误接受的问题。
          
          ### 测试与功能边界
          - 31 项启动器测试 + 28 项原有自检通过，包含真实子进程和窗口生命周期测试。
          - **这不是三人游戏完整实现。** 独立桌面、物理键鼠独占、图形资源分配仍依赖另行安装和配置的外部多工位引擎。
          - 不包含 ASTER 驱动或许可证，也没有自动集成其 SDK。
          - 游戏名称只是可配置启动项；三屏硬件、真实游戏对局和反作弊兼容性均未验证。
          - 无新增 OpenSeat 账号、激活或角色权限体系。
          - 保留已有输入测试、屏幕监控与 VMware 配置功能；EXE 未签名。
          
          附件：完整 ZIP、两个独立 EXE、SHA256SUMS.txt。推荐下载 ZIP。
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG dist/OpenSeat.exe dist/OpenSeat.Gaming.exe OpenSeat-0.4.0-preview.1-win-x64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title 'OpenSeat 0.4.0 — 原生会话游戏启动器（开发预览）' --notes-file release-notes.md --draft --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation or upload failed' }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.assets.Count -ne 4) { throw 'Release asset verification failed' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

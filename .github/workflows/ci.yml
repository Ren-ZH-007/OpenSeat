name: Build and self-test (Windows)
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Windows x64 application
        shell: pwsh
        run: |
          cmd /c build-native.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:exe /platform:x64 /optimize+ /out:dist\OpenSeat.Tests.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll native\OpenSeat.cs native\VmSeats.cs native\SelfTest.cs
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
      - name: Run native self-tests
        shell: pwsh
        env:
          OPENSEAT_CI: '1'
        run: |
          & .\dist\OpenSeat.Tests.exe --self-test 2>&1 | Tee-Object -FilePath native-test-results.txt
          if ($LASTEXITCODE -ne 0) { Get-Content native-test-results.txt | Select-Object -First 6 | ForEach-Object { Write-Output "::error::$_" }; throw 'Native self-tests failed' }
          if (-not (Select-String -Path native-test-results.txt -Pattern '32 checks passed' -Quiet)) { throw 'Expected assertion count not found' }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSeat-win-x64-ci
          path: |
            dist/OpenSeat.exe
            native-test-results.txt
